<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cari Barang — LoFo</title>
<meta name="description" content="Cari barang hilang dan temuan di LoFo berdasarkan kata kunci, kategori, jenis, dan lokasi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="cari">
<div id="site-header"></div>
<main class="page catalog-page">
  <section class="catalog-heading" aria-labelledby="catalog-title">
    <div class="container">
      <h1 id="catalog-title">Cari Barang Hilang &amp; Temuan</h1>
      <div class="catalog-heading__controls">
        <form class="catalog-search" id="report-search" role="search" aria-label="Pencarian laporan" action="cari.html">
          <label class="sr-only" for="q">Kata kunci laporan</label>
          <span data-icon="search" aria-hidden="true"></span>
          <input class="input" type="search" id="q" name="q" maxlength="100" placeholder="Cari nama barang atau lokasi…">
          <button class="btn btn--primary btn--sm" type="submit">Cari</button>
        </form>
        <button class="btn btn--ghost catalog-filter-toggle" type="button" id="toggle-filters" aria-controls="report-filters" aria-expanded="false"><span data-icon="filter" aria-hidden="true"></span>Filter Lanjutan</button>
      </div>
    </div>
  </section>
  <div class="container catalog-layout">
    <aside class="catalog-filters" id="report-filters" aria-labelledby="filter-title">
      <form id="filter-form">
        <div class="row-between"><h2 id="filter-title">Filter</h2><button class="catalog-reset" type="button" id="reset-filters">Reset</button></div>
        <fieldset>
          <legend>Kategori</legend>
          <label><input type="radio" name="category" value="" checked>Semua kategori</label>
          <label><input type="radio" name="category" value="elektronik">Elektronik</label>
          <label><input type="radio" name="category" value="dompet">Dompet &amp; Tas</label>
          <label><input type="radio" name="category" value="kunci">Kunci</label>
          <label><input type="radio" name="category" value="dokumen">Dokumen</label>
          <label><input type="radio" name="category" value="pakaian">Pakaian</label>
          <label><input type="radio" name="category" value="lainnya">Lainnya</label>
        </fieldset>
        <fieldset>
          <legend>Jenis Laporan</legend>
          <label><input type="radio" name="type" value="" checked>Semua jenis</label>
          <label><input type="radio" name="type" value="hilang">Hilang</label>
          <label><input type="radio" name="type" value="temuan">Temuan</label>
        </fieldset>
        <div class="catalog-location"><label for="location">Lokasi</label>
          <input class="input" type="text" id="location" name="location" placeholder="Nama lokasi lengkap" maxlength="100">
        </div>
        <button class="btn btn--primary btn--block" type="submit">Terapkan Filter</button>
      </form>
    </aside>
    <section class="catalog-results" aria-label="Hasil pencarian">
      <div class="row-between catalog-results__toolbar">
        <span id="report-count" class="small muted strong" role="status">Memuat laporan…</span>
        <label class="sr-only" for="sort">Urutkan</label>
        <select class="select" id="sort"><option value="newest">Terbaru</option><option value="oldest">Terlama</option></select>
      </div>
      <div class="item-list" id="report-list" aria-busy="true"></div>
      <div class="catalog-empty" id="report-message" hidden>
        <span data-icon="search" aria-hidden="true"></span>
        <h2 id="report-message-title"></h2>
        <p id="report-message-help" class="small muted"></p>
        <button class="btn btn--ghost btn--sm" type="button" id="retry-reports" hidden>Coba lagi</button>
      </div>
      <noscript><p>Aktifkan JavaScript untuk memuat laporan.</p></noscript>
    </section>
  </div>
</main>
<div id="site-footer"></div>
<div id="site-bottomnav"></div>
<script src="assets/js/app.js"></script>
<script src="assets/js/cari.js"></script>
</body>
</html>
